function iniciar(reset){
  const cats=[...new Set(cartoes.slice().sort((a,b)=>(a.vol||99)-(b.vol||99)).map(c=>c.categoria))];

  if(!cats.includes(S.cat))S.cat=cats[0];
  if(reset!==false){
    let f=cartoes.filter(c=>c.categoria===S.cat&&(!S.niveis.length||S.niveis.includes(c.nivel)));
    f.sort((a,b)=>a.numero-b.numero);
    if(S.rand)for(let i=f.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[f[i],f[j]]=[f[j],f[i]]}

  }
  desenhar(cats);
}

  <select id="sc">${cats.map(c=>`<option value="${esc(c)}" ${c===S.cat?"selected":""}>${esc(c)} (${cartoes.filter(x=>x.categoria===c).length})</option>`).join("")}</select>
  <div class="${niveis.length>1?"":"hide"}"><label class="mut">Nível</label></div>
  <div id="nv" class="${niveis.length>1?"":"hide"}" style="display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px">${niveis.map(n=>`<button data-n="${esc(n)}" class="${S.niveis.includes(n)?"on":""}">${esc(n)}</button>`).join("")}</div>
  <label><input type="checkbox" id="rd" ${S.rand?"checked":""}> Ordem aleatória</label></div>`;
  const {fila,pos}=S;
  if(!fila.length)h+='<div class="card">Nenhuma pergunta com esse filtro.</div>';
  else if(pos>=fila.length)h+=`<div class="card"><div class="q">Terminou! 🎉</div>Você passou por ${fila.length} perguntas.<br><br><button class="p" id="re">🔁 Recomeçar</button></div>`;
  else{
    const c=fila[pos];
    h+=`<div class="card"><div class="bar"><i style="width:${pos/fila.length*100}%"></i></div>
    <div class="mut">Pergunta ${pos+1} de ${fila.length} · ${esc(c.nivel)}</div>
    <div class="q">${esc(c.pergunta)}</div>`+
    (S.mostrar?`<div class="a">${esc(c.resposta)}</div><button class="p" id="prox" style="width:100%">➡️ Próxima</button>`
              :`<button class="p" id="ver" style="width:100%">👁️ Ver resposta</button>`)+`</div>`;
  }
  $("estudar").innerHTML=h;
  $("sc").onchange=e=>{S.cat=e.target.value;S.niveis=[];iniciar()};
  $("nv").querySelectorAll("button").forEach(b=>b.onclick=()=>{const n=b.dataset.n;S.niveis=S.niveis.includes(n)?S.niveis.filter(x=>x!==n):[...S.niveis,n];iniciar()});
  $("rd").onchange=e=>{S.rand=e.target.checked;iniciar()};
  if($("re"))$("re").onclick=()=>iniciar();
  if($("ver"))$("ver").onclick=()=>{S.mostrar=true;desenhar(cats)};
  if($("prox"))$("prox").onclick=()=>{S.pos++;S.mostrar=false;desenhar(cats)};
}

iniciar();
</script>
</body>
</html>
